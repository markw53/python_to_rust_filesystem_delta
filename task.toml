schema_version = "1.1"

[task]
name = "sycamore/python_to_rust_filesystem_delta"
description = "Translate a Python filesystem delta library into idiomatic Rust, preserving CLI behavior and patch operation semantics."
authors = [{ name = "Mark Workman", email = "mw476@expert.micro1.ai" }]
keywords = [
  "sycamore",
  "repository-translation",
  "python",
  "rust",
  "filesystem",
]

[metadata]
source = "m1-rl-envs"
environment_id = "sycamore"
instance_id = "sycamore__python_to_rust_filesystem_delta"
pipeline = "sycamore"
task_type = "repository_translation"
language_pair = "python_to_rust"
direction = "Python to Rust"
difficulty_band = "hard"
target_language = "rust"
target_crate = "filesystem_delta"

[verifier]
timeout_sec = 1800.0

